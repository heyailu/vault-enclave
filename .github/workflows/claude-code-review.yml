# Claude reviews each non-draft pull request on every push, for bugs, CLAUDE.md compliance and security (the
# "Security" section of CLAUDE.md), and posts findings as inline comments plus one summary comment per run.
# Later runs don't repeat findings already posted and note which ones were fixed. It only comments: it never
# approves, requests changes, or merges.
#
# The review instructions are .claude/commands/pr-review.md, adapted from the code-review plugin (which
# stops after Claude's first comment). The action restores .claude/ and CLAUDE.md from the base branch
# before running, so a pull request can't change its own review instructions.
# See https://code.claude.com/docs/en/github-actions
#
# Authenticates with a Claude subscription, not API credit: CLAUDE_CODE_OAUTH_TOKEN is a token made with
# `claude setup-token` by the repo owner, so reviews count against their plan's usage limits. It's tied to that
# person's account: if they leave, change plan or revoke it, reviews stop until a new token is saved. Treat it as
# a credential that can spend the owner's usage. It's reachable by any workflow run on a branch in this repo
# (forks don't get secrets), so only people with write access can use it; rotate it if that changes.
# (Workload identity federation, billed to Claude Console credit, was used before November 2026.)
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # the action trades it for its GitHub App token
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # The review reads earlier inline comments to avoid repeating itself. Fetching them here, with this
      # run's read-only token, keeps `gh api` (which could also write) out of Claude's tools.
      - name: Fetch earlier inline review comments
        env:
          GH_TOKEN: ${{ github.token }}
        # Its own folder: Claude gets read access to this folder only, not the rest of RUNNER_TEMP.
        run: |
          mkdir -p "$RUNNER_TEMP/pr-review"
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments" \
            | jq -s 'add // [] | map({author: .user.login, path, line, body, commit: .commit_id})' \
            > "$RUNNER_TEMP/pr-review/prior-comments.json"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/pr-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }} prior-comments=${{ runner.temp }}/pr-review/prior-comments.json"
          # The run is unattended, so any tool not listed here is refused, and the review silently finds
          # nothing (it can't read the diff). This must match the allowed-tools in
          # .claude/commands/pr-review.md, plus Agent (Task in older Claude Code) for its subagents. The
          # inline-comment tool must be listed for the action to start its server.
          claude_args: >-
            --allowedTools
            "Agent,Task,Read,Glob,Grep,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
            --add-dir ${{ runner.temp }}/pr-review
