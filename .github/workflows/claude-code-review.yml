# Claude reviews each pull request for bugs and posts its findings as inline comments (or one summary
# comment when it finds none). It only comments: it never approves, requests changes, or merges.
# It follows CLAUDE.md, and skips draft PRs and PRs it has already commented on.
# See https://code.claude.com/docs/en/github-actions
#
# No secret: the action trades this run's GitHub OIDC token for a short-lived Claude API token through
# workload identity federation (Claude Console → Settings → Workload identity). The IDs below are not
# credentials. The federation rule must accept pull_request runs from this repository. Don't add an
# anthropic_api_key or claude_code_oauth_token input: a static credential overrides federation.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # fetches the OIDC token for federation
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_organization_id: 3df415af-f646-47c4-857e-c3fa07afac4b
          anthropic_federation_rule_id: fdrl_01YD16gRE3AwkQpUn8tSQdVW
          anthropic_service_account_id: svac_01UcBuyByHuw3MMKpKHPSrKp
          anthropic_workspace_id: wrkspc_011khkTFyCD33cbdeRgJqjFf
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Needed even though the skill names this tool: the action only starts the inline-comment
          # server when --allowedTools lists it.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
