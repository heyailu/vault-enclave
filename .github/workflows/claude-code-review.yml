# Claude reviews each non-draft pull request on every push, for bugs, CLAUDE.md compliance and security (the
# "Security" section of CLAUDE.md), and posts findings as inline comments plus one summary comment per run.
# Later runs don't repeat findings already posted and note which ones were fixed. It only comments: it never
# approves, requests changes, or merges.
#
# The review instructions are .claude/commands/pr-review.md, adapted from the code-review plugin (which
# stops after Claude's first comment). The action restores .claude/ and CLAUDE.md from the base branch
# before running, so a pull request can't change its own review instructions.
# See https://code.claude.com/docs/en/github-actions
#
# No secret: the action trades this run's GitHub OIDC token for a short-lived Claude API token through
# workload identity federation (Claude Console → Settings → Workload identity). The IDs below are not
# credentials. The federation rule must accept pull_request runs from this repository. Don't add an
# anthropic_api_key or claude_code_oauth_token input: a static credential overrides federation.
# Usage is billed to the Claude Console organization's credit balance.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # fetches the OIDC token for federation
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # The review reads earlier inline comments to avoid repeating itself. Fetching them here, with this
      # run's read-only token, keeps `gh api` (which could also write) out of Claude's tools.
      - name: Fetch earlier inline review comments
        env:
          GH_TOKEN: ${{ github.token }}
        # Its own folder: Claude gets read access to this folder only, not the rest of RUNNER_TEMP (which
        # holds the federation identity token).
        run: |
          mkdir -p "$RUNNER_TEMP/pr-review"
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments" \
            | jq -s 'add // [] | map({author: .user.login, path, line, body, commit: .commit_id})' \
            > "$RUNNER_TEMP/pr-review/prior-comments.json"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_organization_id: 3df415af-f646-47c4-857e-c3fa07afac4b
          anthropic_federation_rule_id: fdrl_01YD16gRE3AwkQpUn8tSQdVW
          anthropic_service_account_id: svac_01UcBuyByHuw3MMKpKHPSrKp
          anthropic_workspace_id: wrkspc_011khkTFyCD33cbdeRgJqjFf
          prompt: "/pr-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }} prior-comments=${{ runner.temp }}/pr-review/prior-comments.json"
          # Needed even though the command names this tool: the action only starts the inline-comment
          # server when --allowedTools lists it.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment" --add-dir ${{ runner.temp }}/pr-review'
