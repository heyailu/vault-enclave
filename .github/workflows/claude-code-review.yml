# Claude reviews each pull request for bugs and posts its findings as inline comments (or one summary
# comment when it finds none). It only comments: it never approves, requests changes, or merges.
# It follows CLAUDE.md, and skips draft PRs and PRs it has already commented on.
# See https://code.claude.com/docs/en/github-actions
#
# Secret (Settings → Secrets and variables → Actions): CLAUDE_CODE_OAUTH_TOKEN, generated by running
# `claude setup-token` locally (uses your Claude subscription). To use a Claude Console API key instead,
# add ANTHROPIC_API_KEY and swap the claude_code_oauth_token line for
# `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Needed even though the skill names this tool: the action only starts the inline-comment
          # server when --allowedTools lists it.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
