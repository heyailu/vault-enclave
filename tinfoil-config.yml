# Ailu vault enclave.
#
# This file is the public record of exactly what runs inside Ailu's vault: the container image
# (pinned by digest), its settings, and the only hosts it can reach. Each GitHub release of this
# repo is a signed measurement of this file; see README.md for how to check a running vault
# against it.
#
# Secret values are never here. `secrets` only names them; Tinfoil delivers the values at runtime.

cvm-version: 0.14.7
cpus: 2
memory: 8192

networks:
  # Outbound access is closed by default. The vault can reach only these hosts.
  egress:
    egress: allowlist
    allow:
      - aws-0-eu-west-2.pooler.supabase.com   # Postgres, via Supabase's IPv4 session pooler
      - api.resend.com                  # verification-code emails
      - ea-edubase-api-prod.azurewebsites.net   # England's public register of schools (GIAS), daily

containers:
  - name: vault
    image: "ghcr.io/heyailu/vault@sha256:cb71d62b205c2e2160c0d6a7b127e9eefbb5abb4d7a2028db97809de33eddea7"
    env:
      - PORT: "8080"
      # The vault serves the app at app.heyailu.com. Passkeys are bound to the registrable domain,
      # heyailu.com, so the app can move between subdomains without breaking them.
      - RP_ID: "heyailu.com"
      - APP_ORIGIN: "https://app.heyailu.com"
      - MAIL_FROM: "Ailu <hello@heyailu.com>"   # heyailu.com is the sending domain verified in Resend
      - DB_SCHEMA: "ailu_vault"
      # Download the public register of schools parents pick from, then refresh it daily.
      - SCHOOLS_SOURCE: "gias"
    secrets:
      - VAULT_SIGNING_KEY      # Ed25519 key that signs access tokens
      - OPAQUE_SERVER_SETUP    # OPAQUE server key and OPRF seed; never stored in the database
      - DATABASE_URL
      - RESEND_API_KEY
    networks: [egress]

shim:
  upstream-port: 8080
  paths:
    - /*
