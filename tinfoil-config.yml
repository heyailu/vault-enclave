# Ailu vault enclave.
#
# This file is the public record of exactly what runs inside Ailu's vault: the container image
# (pinned by digest), its settings, and the only hosts it can reach. Each GitHub release of this
# repo is a signed measurement of this file; see README.md for how to check a running vault
# against it.
#
# Secret values are never here. `secrets` only names them; Tinfoil delivers the values at runtime.
#
# Placeholders in <angle brackets> are filled in before the first release.

cvm-version: 0.14.7
cpus: 2
memory: 8192

networks:
  # Outbound access is closed by default. The vault can reach only these hosts.
  egress:
    egress: allowlist
    allow:
      - <supabase-pooler-host>          # Postgres, via Supabase's IPv4 session pooler
      - api.resend.com                  # verification-code emails

containers:
  - name: vault
    image: "ghcr.io/heyailu/vault@sha256:<digest>"
    env:
      - PORT: "8080"
      # The app is served by the vault itself for now, on Tinfoil's address. Passkeys are bound
      # to this hostname, so it moves to heyailu.com before real families sign up.
      - RP_ID: "vault.nothing-ever-happens.containers.tinfoil.dev"
      - APP_ORIGIN: "https://vault.nothing-ever-happens.containers.tinfoil.dev"
      - MAIL_FROM: "Ailu <hello@heyailu.com>"
      - DB_SCHEMA: "vault"
    secrets:
      - VAULT_SIGNING_KEY      # Ed25519 key that signs access tokens
      - OPAQUE_SERVER_SETUP    # OPAQUE server key and OPRF seed; never stored in the database
      - DATABASE_URL
      - RESEND_API_KEY
    networks: [egress]

shim:
  upstream-port: 8080
  paths:
    - /*
